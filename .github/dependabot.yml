version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /scanner
    schedule:
      interval: monthly
  - package-ecosystem: cargo
    directory: /src/app
    schedule:
      interval: monthly
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
