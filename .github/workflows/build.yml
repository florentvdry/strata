name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check renderer syntax
        shell: bash
        run: for f in $(find src -name '*.js'); do node --check "$f"; done

      - name: Build installer and portable app
        run: npm run dist

      - uses: actions/upload-artifact@v7
        with:
          name: strata-windows
          path: |
            dist/Strata-Setup-*.exe
            dist/Strata-*-Portable.exe
          if-no-files-found: error
          retention-days: 14
