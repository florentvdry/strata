name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['website/**', 'docs/**', '**/*.md', '.github/workflows/website.yml', '.github/workflows/changelog.yml']
  pull_request:
    paths-ignore: ['website/**', 'docs/**', '**/*.md', '.github/workflows/website.yml', '.github/workflows/changelog.yml']
  workflow_dispatch:
  # The Release workflow builds with the same jobs, with signing on.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

# A new push to a pull request makes the previous run pointless.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pull requests get a quick debug build that still runs the smoke test; main, manual runs and releases build and package the real installers.
  QUICK: ${{ github.event_name == 'pull_request' }}
  # Makes `tauri build` write the .sig files the updater verifies (needs TAURI_SIGNING_PRIVATE_KEY).
  TAURI_RELEASE_CONFIG: ${{ inputs.release && '--config tauri.release.conf.json' || '' }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scanner
            src/app
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Check renderer syntax
        shell: bash
        run: for f in $(find src scripts -name '*.js' -not -path '*/vendor/*'); do node --check "$f"; done

      - name: Check import map, vendored libraries and changelog
        run: npm run check

      - name: Test the release scripts
        run: npm run test:scripts

      - name: Scanner format, lints and unit tests
        working-directory: scanner
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the scanner
        run: npm run build:scanner

      - name: Test the scanner end to end
        run: npm run test:scanner

      # The runner is administrator and C: is NTFS.
      - name: Fast scan finds the same tree as a folder walk
        run: node scripts/check-fast-scan.js --bench

      - name: App format, lints and unit tests
        working-directory: src/app
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the installer
        if: env.QUICK != 'true'
        run: npx tauri build --bundles nsis ${{ env.TAURI_RELEASE_CONFIG }}
        working-directory: src/app

      - name: Build the app (debug, no installer)
        if: env.QUICK == 'true'
        run: npx tauri build --debug --no-bundle
        working-directory: src/app

      - name: Smoke test the built app
        run: node scripts/smoke-test.js ${{ env.QUICK == 'true' && 'src/app/target/debug/strata.exe' || '' }}

      - name: Package installer and portable app
        if: env.QUICK != 'true'
        run: node scripts/package-release.js

      - uses: actions/upload-artifact@v7
        if: env.QUICK != 'true'
        with:
          name: strata-windows
          path: |
            dist/Strata-Setup-*.exe*
            dist/Strata-*-Portable.exe*
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    env:
      # The AppImage tools can't strip newer binaries' sections on some systems; Strata's is stripped by Cargo already.
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The scanner is built for musl: one static binary for every distribution.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            scanner
            src/app
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # WebKitGTK and GTK for the app (built on 22.04 so it runs on 22.04 and newer), musl-tools for the scanner,
      # ntfs-3g and zstd for fresh NTFS test images and the pacman package, xvfb for the smoke test.
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential curl wget file musl-tools ntfs-3g zstd rpm libarchive-tools xvfb

      - name: Install dependencies
        run: npm ci

      - name: Check renderer syntax
        run: for f in $(find src scripts -name '*.js' -not -path '*/vendor/*'); do node --check "$f"; done

      - name: Check import map, vendored libraries and changelog
        run: npm run check

      - name: Test the release scripts
        run: npm run test:scripts

      - name: Scanner format, lints and unit tests
        working-directory: scanner
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Fast scan on freshly made NTFS images
        working-directory: scanner
        run: |
          sudo python3 tests/make-ntfs-fixture.py "$RUNNER_TEMP/ntfs"
          STRATA_NTFS_FIXTURES="$RUNNER_TEMP/ntfs" cargo test --locked mft::

      - name: Build the scanner
        run: npm run build:scanner

      - name: Test the scanner end to end
        run: npm run test:scanner

      - name: App format, lints and unit tests
        working-directory: src/app
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build the app (debug, no packages)
        if: env.QUICK == 'true'
        run: npx tauri build --debug --no-bundle
        working-directory: src/app

      # An RPM version can't contain "-", so pre-releases (0.3.0-beta.1) are built without the .rpm.
      - name: Build deb, rpm and AppImage
        if: env.QUICK != 'true'
        run: |
          bundles=deb,rpm,appimage
          case "$(node -p "require('../../package.json').version")" in *-*) bundles=deb,appimage ;; esac
          npx tauri build --bundles "$bundles" ${{ env.TAURI_RELEASE_CONFIG }}
        working-directory: src/app

      - name: Smoke test the built app
        run: xvfb-run -a node scripts/smoke-test.js ${{ env.QUICK == 'true' && 'src/app/target/debug/strata' || '' }}

      - name: Package everything, with the pacman package and the tarball
        if: env.QUICK != 'true'
        run: node scripts/package-release.js

      - uses: actions/upload-artifact@v7
        if: env.QUICK != 'true'
        with:
          name: strata-linux
          path: |
            dist/Strata-*.AppImage*
            dist/Strata-*.deb*
            dist/Strata-*.rpm*
            dist/Strata-*.pacman
            dist/Strata-*.tar.gz
          if-no-files-found: error
          retention-days: 14
